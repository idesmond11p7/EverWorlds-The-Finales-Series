  <path class="ridge" d="M291 454 L315 465 L328 485 L349 496 L357 520 L340 544"/>
  <path class="ridge2" d="M291 454 L315 465 L328 485 L349 496 L357 520 L340 544"/>
  <path class="ridge" d="M1036 495 L1053 516 L1060 542 L1083 554 L1097 582"/>
  <path class="ridge2" d="M1036 495 L1053 516 L1060 542 L1083 554 L1097 582"/>
  <!-- Rivers: source and outlet relationships are schematic only -->
  <path class="river" d="M610 244 Q601 282 620 309 T631 363 Q645 395 681 420 T711 466 Q720 485 738 502"/>
  <path class="tributary" d="M538 300 Q571 319 620 309"/>
  <path class="tributary" d="M577 363 Q603 351 631 363"/>
  <path class="river" d="M681 255 Q704 286 696 321 T721 371 Q746 395 738 431 T766 478"/>
  <path class="tributary" d="M651 328 Q676 321 696 321"/>
  <path class="river" d="M874 250 Q859 280 872 305 T886 346 Q909 374 936 390 T974 430"/>
  <path class="tributary" d="M944 316 Q922 332 886 346"/>
  <path class="river" d="M1132 464 Q1121 493 1141 520 T1153 572 Q1154 596 1170 613"/>
  <path class="tributary" d="M1081 512 Q1106 526 1141 520"/>
  <path class="river" d="M315 402 Q335 435 329 462 T348 501 Q362 527 352 555"/>
  <!-- Inland basin -->
  <ellipse cx="971" cy="389" rx="38" ry="19" fill="#b8a56f" stroke="#6e5939" stroke-width="2"/>
  <ellipse cx="971" cy="389" rx="24" ry="10" fill="#6fa7a7" opacity=".9"/>
  <!-- Strategic routes -->
  <path class="route" d="M438 389 Q503 425 565 410 T711 466 Q800 470 874 450"/>
  <path class="route" d="M874 450 Q941 469 1036 529 T1170 613"/>
  <path class="route" d="M315 465 Q361 449 397 418 T514 371"/>
  <path class="route" d="M974 430 Q1008 399 1032 365 T1081 330"/>
  <path class="route" d="M1290 350 Q1312 369 1338 388 T1407 489"/>
  <!-- Region labels -->
  <text x="582" y="165" class="label" text-anchor="middle">NORTHERN SHIELD</text>
  <text x="582" y="187" class="sub" text-anchor="middle">cold interior · snowmelt · seasonal routes</text>
  <text x="533" y="455" class="label" text-anchor="middle">IMPERIAL HEARTLAND</text>
  <text x="533" y="477" class="sub" text-anchor="middle">canon footprint not drawn to scale</text>
  <text x="934" y="339" class="label" text-anchor="middle">GREAT ARID BELT</text>
  <text x="934" y="361" class="sub" text-anchor="middle">dune · stone · salt · cold & volcanic deserts</text>
  <text x="1108" y="562" class="label" text-anchor="middle">GREEN BASINS</text>
  <text x="1108" y="583" class="sub" text-anchor="middle">wet slopes · floodplains · seasonal rivers</text>
  <text x="300" y="582" class="label" text-anchor="middle">BROKEN WEST</text>
  <text x="300" y="602" class="sub" text-anchor="middle">rifts · inland seas · passes</text>
  <text x="1347" y="635" class="label" text-anchor="middle">OUTER MARITIME</text>
  <text x="1347" y="656" class="sub" text-anchor="middle">island arcs · shelves · deepwater</text>
  <!-- Water labels -->
  <text x="1110" y="240" class="sub" text-anchor="middle" style="font-style:italic">Outer Ocean</text>
  <text x="740" y="650" class="sub" text-anchor="middle" style="font-style:italic">Southern Ocean Basin</text>
  <text x="530" y="740" class="sub" text-anchor="middle" style="font-style:italic">Western Inland Sea</text>
  <!-- Legend -->
  <rect x="50" y="785" width="1500" height="160" rx="16" fill="#07131f" stroke="#476475" stroke-width="1.5" opacity=".97"/>
  <text x="78" y="821" class="label" style="font-size:17px">MAP KEY</text>
  <path d="M80 850 H130" class="ridge"/><path d="M80 850 H130" class="ridge2"/><text x="142" y="855" class="sub">mountain axis (schematic)</text>
  <path d="M380 850 H430" class="river"/><text x="442" y="855" class="sub">river (direction not encoded by arrow)</text>
  <path d="M760 850 H810" class="route"/><text x="822" y="855" class="sub">strategic route hypothesis</text>
  <rect x="1120" y="838" width="35" height="22" fill="url(#desert)" stroke="#c88b4a"/><text x="1167" y="855" class="sub">arid-zone texture</text>
  <text x="80" y="895" class="mapnote">O = original macro-geography</text>
  <text x="380" y="895" class="mapnote">C = canon geography, pending direct source verification</text>
  <text x="890" y="895" class="mapnote">U = unresolved / provisional</text>
  <text x="80" y="923" class="sub">This draft is topology-first. Coastlines, drainage, climate and routes must be reviewed together. Do not infer distances, borders, coordinates, or canon placements from this drawing.</text>
</svg>